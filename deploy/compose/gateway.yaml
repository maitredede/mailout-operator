# Standalone gateway configuration, as consumed by `mailout gateway -c`.
# In a cluster the operator renders the same shape from the CRDs.
hostname: mailout.test

listeners:
  - name: submission
    addr: ":587"
    mode: starttls
  - name: smtps
    addr: ":465"
    mode: implicit

tls:
  # Two certificates, so SNI can actually be observed: connecting with
  # servername mailout.test and alt.mailout.test serves different leaves.
  certificates:
    - name: gateway
      certFile: /etc/mailout/certs/gateway.crt
      keyFile: /etc/mailout/certs/gateway.key
    - name: gateway-alt
      certFile: /etc/mailout/certs/gateway-alt.crt
      keyFile: /etc/mailout/certs/gateway-alt.key
  defaultCertificate: gateway

upstream:
  host: mailpit
  port: 1025
  tls: none

accounts:
  # password: demo-password (see deploy/compose/README.md)
  - username: app1
    passwordHash: "$2a$12$C7yTXw50xW.ESgrG6t3Ip.Nm0epgrTWQfX88LiB7PZc/SqmfLmLki"
    # An account may only send from what is listed here, and only these domains
    # are signed for it: a signature vouches for a domain, so being allowed to
    # send there is what earns one. Leave this out and the account sends
    # nothing — in a cluster the operator fills it in from the gateway's own
    # spec.allowedSenders, which is where the decision belongs.
    allowedSenders:
      - "*@example.test"

dkim:
  # Only mail whose sender domain matches gets signed; anything else goes out
  # unsigned rather than mis-signed.
  - domain: example.test
    selector: mail
    privateKeyFile: /etc/mailout/certs/dkim.key

milters:
  - name: clamav
    address: tcp://clamav-milter:7357
    timeout: 30s
    # failOpen stays off: if the scanner is down, mail waits rather than going
    # out unscanned.

limits:
  maxMessageBytes: 10485760
  maxRecipients: 20
