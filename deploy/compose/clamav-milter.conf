# clamav-milter for the local validation stack.
MilterSocket inet:7357
Foreground yes
ClamdSocket tcp:clamav:3310
# Refuse infected mail outright; the gateway relays the rejection to the client.
OnInfected Reject
RejectMsg "Malware detected: %v"
# Prove the milter modification path: every scanned message gets a header.
AddHeader Replace
LogSyslog no
LogVerbose no
LogInfected Basic
User clamav
FixStaleSocket yes
