# Local validation of the mailout dataplane, without Kubernetes.
#
#   make compose-up
#   # then: swaks --to dest@example.test --from app@example.test \
#   #         --server localhost:1587 --tls --auth-user app1 --auth-password demo-password
#   # and read the result at http://localhost:18025
#
# Certificates come from `make compose-certs` and are signed by a throwaway CA
# (deploy/compose/certs/ca.crt) — pass it to your client, or disable
# verification.

name: mailout

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["gateway", "-c", "/etc/mailout/gateway.yaml", "--log-level=debug"]
    ports:
      # High host ports, to avoid colliding with a local MTA or another stack.
      - "1587:587"
      - "1465:465"
    volumes:
      - ./gateway.yaml:/etc/mailout/gateway.yaml:ro
      - ./certs:/etc/mailout/certs:ro
    depends_on:
      mailpit:
        condition: service_started
      clamav-milter:
        condition: service_started

  # Stands in for the target SMTP server. Its HTTP API is the oracle the tests
  # assert against.
  mailpit:
    image: axllent/mailpit:v1.31.1
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "18025:8025"

  # Virus scanner. The first start downloads the signature database, which takes
  # a few minutes; the healthcheck is what the milter waits on.
  clamav:
    image: clamav/clamav:1.5.4
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  # Bridges the gateway's milter protocol to clamd.
  clamav-milter:
    image: clamav/clamav:1.5.4
    entrypoint: ["clamav-milter", "--config-file=/etc/clamav/clamav-milter.conf"]
    volumes:
      - ./clamav-milter.conf:/etc/clamav/clamav-milter.conf:ro
    depends_on:
      clamav:
        condition: service_healthy

volumes:
  clamav-db:
