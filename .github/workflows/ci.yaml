# CI mailout-operator, sur les runners hébergés par GitHub.
#
# Ce dépôt est PUBLIC, et c'est ce qui décide de tout ici :
#
#  - les runners hébergés y sont gratuits et sans quota, donc l'ancienne raison de
#    tourner sur un runner auto-hébergé (« GitHub refuse de démarrer les runners
#    hébergés », un problème de facturation qui ne vise que les dépôts privés) ne
#    s'applique plus ;
#  - un dépôt public ne peut PAS appeler un workflow réutilisable hébergé dans un
#    dépôt privé. `maitredede/ci` est privé : l'appel à `go-ci.yml` faisait échouer
#    le run au démarrage, sans produire un seul job et sans message exploitable
#    (`total_count: 0`, et GitHub refusait même de le relancer). Les étapes du job
#    `go` sont donc recopiées ici plutôt qu'appelées.
#
# Conséquence de cette recopie : ce fichier ne suit plus les évolutions de
# `maitredede/ci`. C'est le prix du dépôt public, pas un oubli. Si `ci` devenait
# public, ce job redeviendrait un `uses:` d'une ligne.
#
# Un gain au passage : `go test -race` est ACTIVÉ ici. Il ne l'était pas sur le
# runner ARC parce que le détecteur de course exige cgo et que l'image
# ghcr.io/actions/actions-runner n'embarque pas de compilateur C. Les runners
# hébergés en ont un.
#
# Ce qui ne tourne toujours pas en CI, inchangé : `make test-e2e` et
# `make test-cluster`. Ils pilotent des conteneurs (testcontainers → Mailpit,
# ClamAV, Valkey, un k3s entier). Un runner hébergé a un daemon Docker, donc la
# barrière technique d'hier est levée — mais les y ramener est une décision à
# prendre, pas un effet de bord de cette migration. À lancer localement avant de
# pousser :
#
#   make test-e2e test-cluster
#
# Les versions d'outils sont épinglées : un linter ou un scanner non épinglé rend
# un build rouge sans qu'aucun commit ne l'explique.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: gofmt
        run: |
          set -euo pipefail
          # Seulement les fichiers suivis par CE dépôt : `gofmt -l .` parcourrait
          # aussi les sous-modules git et les arbres vendorisés.
          out=$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$out" ]; then
            echo "::error::gofmt would reformat:"; printf '%s\n' "$out"; exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -race : voir l'en-tête. Ne lance que les tests unitaires ; les trois
      # autres niveaux sont derrière les tags envtest / e2e / cluster.
      - name: go test
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: govulncheck
        env:
          # Épinglé : @latest rendrait le build non reproductible.
          GOVULNCHECK_VERSION: v1.7.0
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Niveau 2 des tests : contrôleurs et webhooks contre un vrai control plane.
  # Pas de conteneur là-dedans — setup-envtest télécharge les binaires
  # kube-apiserver et etcd et les lance en processus.
  envtest:
    name: Envtest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      # Les recettes du Makefile sont recopiées ici plutôt qu'appelées : le runner
      # ARC n'embarquait pas make. Un runner hébergé en a un — les remplacer par
      # `make manifests` est possible, et volontairement laissé pour un changement
      # qui ne mélange pas deux sujets.
      #
      # controller-gen produit les CRD et le code deepcopy. S'ils diffèrent de ce
      # qui est versionné, un `make manifests` a été oublié : le cluster
      # recevrait des CRD qui ne décrivent pas les types du binaire.
      - name: Manifests à jour
        run: |
          set -euo pipefail
          go tool controller-gen object:headerFile=hack/boilerplate.go.txt \
            paths=./api/... paths=./internal/certmanager/... paths=./internal/monitoring/...
          go tool controller-gen crd rbac:roleName=mailout-operator webhook \
            paths=./api/... paths=./internal/controller/... paths=./internal/webhook/... \
            output:crd:artifacts:config=config/crd/bases
          if ! git diff --exit-code; then
            echo "::error::config/ et zz_generated ne correspondent pas au code : lancer make generate manifests"
            exit 1
          fi

      # La version des binaires envtest est lue dans le Makefile plutôt que
      # répétée : deux endroits qui la déclarent, c'est un jour où la CI teste
      # contre un autre control plane que le poste.
      - name: Tests envtest
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ENVTEST_K8S_VERSION ?= //p' Makefile)
          test -n "$version" || { echo "::error::ENVTEST_K8S_VERSION introuvable dans le Makefile"; exit 1; }
          KUBEBUILDER_ASSETS="$(go tool setup-envtest use "$version" -p path)" \
            go test ./internal/controller/... ./internal/webhook/... -count=1 -tags=envtest
