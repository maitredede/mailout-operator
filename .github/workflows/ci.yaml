# CI mailout-operator, sur le runner ARC de dalykube.
#
# Workflows réutilisables épinglés par SHA (politique de pin : README de maitredede/ci).
#
# Tout tourne sur le runner ARC de dalykube. Pas de job ubuntu-latest : sur ce
# dépôt privé, GitHub refuse de démarrer les runners hébergés (« recent account
# payments have failed or your spending limit needs to be increased »).
#
# Conséquence assumée : `make test-e2e` et `make test-cluster` ne tournent pas en
# CI. Ils pilotent des conteneurs (testcontainers → Mailpit, ClamAV, Valkey, un
# k3s entier) et exigent une API Docker que le runner ARC n'a pas : les images
# partent vers les daemons BuildKit distants, il n'y a pas de socket Docker, et le
# namespace arc-runners est en Pod Security « restricted » — donc pas de DinD
# privilégié non plus.
#
# Or ce sont eux qui trouvent le plus de bugs, et les seuls à vérifier les deux
# replicas, le leader unique et le cloisonnement des locataires. À lancer
# localement avant de pousser :
#
#   make test-e2e test-cluster
#
# Les rapatrier en CI demanderait un scale set dédié avec une PSA relâchée et un
# sidecar DinD privilégié — soit exactement l'exception que « restricted » est là
# pour empêcher.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    uses: maitredede/ci/.github/workflows/go-ci.yml@f7c8befa0a4216b1923b902321b6018b97537acf # main 2026-09-07 (gofmt hors submodules)
    with:
      runner: dede-mailout-operator
      # `go test ./...` ne lance que les tests unitaires : les trois autres
      # niveaux sont derrière les tags envtest / e2e / cluster.
      #
      # `race: false` (défaut du workflow réutilisable) : le détecteur de course
      # exige cgo, absent de l'image ghcr.io/actions/actions-runner.

  # Niveau 2 des tests : contrôleurs et webhooks contre un vrai control plane.
  # Pas de conteneur là-dedans — setup-envtest télécharge les binaires
  # kube-apiserver et etcd et les lance en processus.
  envtest:
    name: Envtest
    runs-on: dede-mailout-operator
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      # Les recettes du Makefile sont recopiées ici plutôt qu'appelées : l'image
      # ghcr.io/actions/actions-runner n'embarque pas make, et le runner tourne
      # en uid 1001 sans sudo, donc rien à installer. C'est pour la même raison
      # que le workflow réutilisable go-ci appelle `go` directement.
      #
      # controller-gen produit les CRD et le code deepcopy. S'ils diffèrent de ce
      # qui est versionné, un `make manifests` a été oublié : le cluster
      # recevrait des CRD qui ne décrivent pas les types du binaire.
      - name: Manifests à jour
        run: |
          set -euo pipefail
          go tool controller-gen object:headerFile=hack/boilerplate.go.txt \
            paths=./api/... paths=./internal/certmanager/... paths=./internal/monitoring/...
          go tool controller-gen crd rbac:roleName=mailout-operator webhook \
            paths=./api/... paths=./internal/controller/... paths=./internal/webhook/... \
            output:crd:artifacts:config=config/crd/bases
          if ! git diff --exit-code; then
            echo "::error::config/ et zz_generated ne correspondent pas au code : lancer make generate manifests"
            exit 1
          fi

      # La version des binaires envtest est lue dans le Makefile plutôt que
      # répétée : deux endroits qui la déclarent, c'est un jour où la CI teste
      # contre un autre control plane que le poste.
      - name: Tests envtest
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ENVTEST_K8S_VERSION ?= //p' Makefile)
          test -n "$version" || { echo "::error::ENVTEST_K8S_VERSION introuvable dans le Makefile"; exit 1; }
          KUBEBUILDER_ASSETS="$(go tool setup-envtest use "$version" -p path)" \
            go test ./internal/controller/... ./internal/webhook/... -count=1 -tags=envtest

