# Image mailout -> registre Zot interne (dkr.daly.nc), via bake multi-arch natif
# sur les daemons BuildKit du cluster.
#
# Ce dépôt est PUBLIC, et c'est ce qui décide de la forme de ce fichier : un dépôt
# public ne peut PAS appeler un workflow réutilisable hébergé dans un dépôt privé.
# `maitredede/ci` est privé, donc l'appel à `bake-images.yml` faisait échouer le run
# au démarrage, sans produire un seul job et sans message exploitable
# (`total_count: 0`, et GitHub refusait même de le relancer). Même verdict pour
# l'action composite privée `maitredede/ci/.github/actions/setup-buildx-remote`.
# Les deux sont donc recopiés ici — uniquement le chemin que CE dépôt emprunte,
# options figées à leurs valeurs, sans les branches génériques inutilisées.
# Conséquence assumée : ce fichier ne suit plus les évolutions de `maitredede/ci`.
# C'est le prix du dépôt public, pas un oubli.
#
# ---------------------------------------------------------------------------
# Pourquoi ce workflow NE PEUT PAS migrer vers `ubuntu-latest`
# ---------------------------------------------------------------------------
# Contrairement à ci.yaml, passé sur runners hébergés dans le même effort, ce
# workflow reste sur `runs-on: dede-mailout-operator`, et c'est de la topologie
# réseau, pas un oubli :
#
#  - il pousse vers `dkr.daly.nc`, un registre du LAN ;
#  - il construit sur les daemons BuildKit `buildkitd-amd64.buildkit.svc` et
#    `buildkitd-arm64.buildkit.svc`, eux aussi sur le LAN (Services du cluster) ;
#  - il s'y authentifie par un certificat client mTLS monté sur l'HÔTE du runner
#    (BUILDKIT_TLS_DIR ci-dessous).
#
# Aucun runner hébergé par GitHub n'atteint quoi que ce soit de tout cela.
#
# Corollaire à garder en tête quand ce workflow devient rouge : les DEUX
# constructions, amd64 comme arm64, ont lieu sur des daemons DANS le cluster. Une
# panne du cluster casse ce workflow où que vive le runner — l'avoir déplacé sur
# dede n'y change rien. Ça vient de nous coûter une soirée de fausses pistes.
#
# ---------------------------------------------------------------------------
# Ce qui a été MESURÉ sur le runner, le 2026-09-17
# ---------------------------------------------------------------------------
# Dans le conteneur `gh-runner-mailout-operator`, uid 1001. Ça vaut pour l'image
# de runner d'aujourd'hui, pas pour l'éternité : une mise à jour d'image peut
# invalider n'importe laquelle de ces lignes.
#
#   docker ................................. PRÉSENT (/usr/bin/docker)
#   envsubst ............................... ABSENT   -> shim obligatoire, cf. plus bas
#   jq, curl, python3, git ................. présents
#   base64 -w0 ............................. fonctionne
#   /certs/buildkit/{ca,tls}.crt, tls.key .. lisibles par l'uid 1001
#   buildkitd-amd64.buildkit.svc:1234 ...... joignable
#   buildkitd-arm64.buildkit.svc:1234 ...... joignable
#   https://fulcio.sigstore.dev ............ 200 -> cosign keyless a sa sortie Internet
#
# Et ce qui reste NON vérifié, à ne pas transformer en affirmation :
#
#  - le `servername` mTLS face aux SAN des certificats des daemons : un nom qui ne
#    colle pas n'échoue qu'au `buildx inspect --bootstrap`, pas avant ;
#  - la forme réelle de `metadata.json` avec un builder à deux nœuds, donc
#    laquelle des deux branches de « Collect pushed reference » répond ;
#  - l'existence des secrets REGISTRY_USER / REGISTRY_PASSWORD au niveau du dépôt
#    (ils étaient passés au workflow appelé, ils sont maintenant lus ici).
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  # Préfixe de nom d'image (hôte du registre + projet) : bake le lie depuis
  # l'environnement à la variable REGISTRY de docker-bake.hcl.
  REGISTRY: dkr.daly.nc/mailout
  REGISTRY_HOST: dkr.daly.nc
  # Matériel mTLS client (ca.crt/tls.crt/tls.key) monté sur l'hôte du runner.
  BUILDKIT_TLS_DIR: /certs/buildkit
  # Versions d'outils épinglées, identiques à celles du workflow réutilisable : un
  # outil non épinglé rend un build rouge sans qu'aucun commit ne l'explique.
  BUILDX_VERSION: v0.37.0
  COSIGN_VERSION: v2.5.2
  TRIVY_VERSION: "0.74.0"
  SYFT_VERSION: v1.51.1

jobs:
  # ---------------------------------------------------------------------------
  # Dérivation des tags et saut « diff de manifestes seulement ». Job séparé pour
  # que le build entier puisse être sauté par un `if:` — filtrer avec
  # `paths-ignore` sur le déclencheur filtrerait AUSSI les tags, et un v* ne
  # publierait alors aucune image semver.
  # ---------------------------------------------------------------------------
  setup:
    name: Compute tags
    runs-on: dede-mailout-operator
    timeout-minutes: 5
    outputs:
      skipped: ${{ steps.plan.outputs.skipped }}
      tag: ${{ steps.plan.outputs.tag }}
      extra_tag: ${{ steps.plan.outputs.extra_tag }}
    steps:
      # fetch-depth: 0 — le diff compare deux commits, et un clone superficiel ne
      # contient pas forcément le point de départ du push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          # Ni docs/ ni test/ n'entrent dans le contexte de build (.dockerignore),
          # et config/ comme deploy/ n'influencent pas le binaire compilé :
          # l'image finale ne contient que lui.
          SKIP_RE: "^(config|deploy|docs)/"
        run: |
          set -euo pipefail
          # Même dérivation que docker/metadata-action : v1.2.3 -> "1.2.3" + "1.2",
          # sinon sha-<7> + edge.
          if [[ "$REF" == refs/tags/v* ]]; then
            version="${REF#refs/tags/v}"
            tag="$version"
            extra="$(printf '%s' "$version" | cut -d. -f1-2)"
            [ "$extra" = "$version" ] && extra=""
          else
            tag="sha-${SHA:0:7}"
            extra="edge"
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "extra_tag=$extra" >> "$GITHUB_OUTPUT"

          # Le saut ne s'applique QUE sur un push de branche : un v* posé sur un
          # commit de manifestes doit tout de même publier ses images semver.
          skipped=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] &&
             [[ "$REF" != refs/tags/* ]] &&
             git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$SHA")
            # `! grep -qvE` : aucune ligne HORS du motif, c'est-à-dire que TOUT le
            # diff est dedans. Un fichier modifié à la racine suffit donc à
            # construire. Un diff vide retombe délibérément sur « construire » —
            # dans le doute, on construit.
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE "$SKIP_RE"; then
              echo "Diff limité à $SKIP_RE — aucune image ne peut avoir changé."
              skipped=true
            fi
          fi
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"

  bake:
    name: Bake & push
    runs-on: dede-mailout-operator
    needs: setup
    if: needs.setup.outputs.skipped != 'true'
    # Garde-fou contre une connexion gRPC buildx->buildkitd à moitié morte qui fige
    # le job (4 h 45 observées sans timeout).
    timeout-minutes: 45
    permissions:
      contents: read
      # cosign est en mode keyless : il a besoin du jeton OIDC du workflow. Sans
      # `id-token: write`, la signature échoue APRÈS le push — image publiée, non
      # signée.
      id-token: write
    env:
      # bake lie ces variables depuis l'environnement, donc rien n'est passé en
      # ligne de commande (cf. docker-bake.hcl).
      TAG: ${{ needs.setup.outputs.tag }}
      EXTRA_TAG: ${{ needs.setup.outputs.extra_tag }}
      # Les deux architectures, et c'est le point : le cluster est trois workers
      # arm64 et un amd64, et l'opérateur tourne deux replicas avec une
      # anti-affinité seulement preferred. Une image mono-arch obligerait à
      # épingler le Deployment sur une architecture — ou à laisser un replica
      # boucler sur « exec format error ».
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # buildx en binaire autonome, et épinglé. `docker/setup-buildx-action` et
      # `docker/build-push-action` construiraient sur un daemon LOCAL, alors que
      # tout doit se passer sur les deux daemons distants — seule façon d'obtenir
      # de l'amd64 ET de l'arm64 natifs. On appelle donc `buildx` directement
      # (bake, imagetools) contre le builder `remote` créé à l'étape suivante.
      - name: Install buildx (standalone)
        run: |
          set -euo pipefail
          # Architecture de l'asset dérivée du runner, pas d'un amd64 en dur.
          case "$(uname -m)" in
            x86_64)  arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::architecture de runner non supportée $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/buildx" \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${arch}"
          chmod +x "$HOME/bin/buildx"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/buildx" version

      # Un seul builder à deux nœuds, chacun épinglé à une plateforme par
      # `--platform` : un seul `bake` dispatche chaque plateforme vers son daemon
      # natif. Pas de QEMU, pas de matrice, pas de job de fusion. L'architecture du
      # runner est sans objet — la construction a lieu sur les daemons.
      - name: Create multi-node remote builder
        run: |
          set -euo pipefail
          for f in ca.crt tls.crt tls.key; do
            [ -r "${BUILDKIT_TLS_DIR}/${f}" ] || {
              echo "::error::${BUILDKIT_TLS_DIR}/${f} manquant — le matériel mTLS client est-il monté sur l'hôte du runner ?" >&2
              exit 1
            }
          done
          append=""
          # `servername` doit correspondre à un SAN du certificat du daemon : c'est
          # l'hôte de l'endpoint.
          for entry in \
            "linux/amd64=tcp://buildkitd-amd64.buildkit.svc:1234" \
            "linux/arm64=tcp://buildkitd-arm64.buildkit.svc:1234"
          do
            platform="${entry%%=*}"
            endpoint="${entry#*=}"
            host="${endpoint#tcp://}"; host="${host%%:*}"
            node="remote-$(printf '%s' "$platform" | tr '/' '-')"
            # shellcheck disable=SC2086
            buildx create --name remote $append \
              --node "$node" \
              --driver remote \
              --platform "$platform" \
              --driver-opt "cacert=${BUILDKIT_TLS_DIR}/ca.crt" \
              --driver-opt "cert=${BUILDKIT_TLS_DIR}/tls.crt" \
              --driver-opt "key=${BUILDKIT_TLS_DIR}/tls.key" \
              --driver-opt "servername=${host}" \
              "$endpoint"
            append="--append"
          done
          buildx use remote
          buildx inspect --bootstrap remote

      # Pas de `docker/login-action`, et ce n'est PAS parce que la CLI Docker
      # manquerait : elle est présente sur ce runner (/usr/bin/docker, mesuré le
      # 2026-09-17). La raison est qu'il n'y a rien à gagner à faire dépendre deux
      # champs JSON d'un binaire tiers et d'une action de plus, quand les quatre
      # outils qui s'authentifient ici — buildx, cosign, trivy, syft — lisent tous
      # directement ce fichier. L'ancienne justification héritée du runner ARC
      # (« pas de CLI Docker ») est fausse ici : ne pas la réintroduire.
      - name: Registry login (config.json)
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.docker"
          auth=$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 -w0)
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY_HOST" "$auth" > "$HOME/.docker/config.json"

      - name: Bake & push
        run: |
          set -euo pipefail
          buildx bake \
            --builder remote \
            --file docker-bake.hcl \
            --provenance=mode=max \
            --push \
            --metadata-file metadata.json \
            default
          test -s metadata.json

      # Référence `image@digest` de l'unique image publiée, consommée par les trois
      # étapes de sécurité qui suivent. C'est le digest de l'index — pas un tag —
      # qui est signé et scanné, donc un écrasement concurrent d'un tag mutable ne
      # peut pas passer la porte.
      #
      # Le nom de l'image est écrit ici plutôt que déduit de metadata.json : ce
      # dépôt a UNE cible, `operator`, et metadata.json n'est pas un contrat stable
      # — avec le builder à deux nœuds (deux builds par plateforme fusionnés en un
      # index), une cible peut ne porter que `containerimage.digest` et pas
      # `image.name`, ou l'inverse (observé le 2026-09-07). Le digest garde donc son
      # repli sur `imagetools inspect`.
      - name: Collect pushed reference
        id: refs
        run: |
          set -euo pipefail
          image="${REGISTRY}/operator"
          digest=""
          # jq est présent sur ce runner (mesuré le 2026-09-17) ; le `command -v`
          # ne fait que refuser de mourir sur une image future qui l'aurait perdu.
          # Le repli `imagetools inspect` ci-dessous couvre un tout autre cas, qui
          # lui est attendu : un metadata.json sans `containerimage.digest`.
          if command -v jq >/dev/null 2>&1; then
            echo "clés de metadata.json par cible :" >&2
            jq -c 'map_values(if type == "object" then keys else . end)' metadata.json >&2
            digest=$(jq -r '.operator["containerimage.digest"] // ""' metadata.json)
          fi
          if [ -z "$digest" ]; then
            echo "pas de containerimage.digest dans metadata.json, inspection de ${image}:${TAG}" >&2
            digest=$(buildx imagetools inspect "${image}:${TAG}" --format '{{.Manifest.Digest}}')
          fi
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::digest inexploitable pour ${image} : '${digest}'" >&2; exit 1 ;;
          esac
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "${image}@${digest}"

      # Étape NÉCESSAIRE, pas une précaution : cosign-installer v4 développe
      # install_dir avec envsubst, et `envsubst` est ABSENT de cette image de
      # runner (mesuré le 2026-09-17 ; pas de gettext, et l'uid 1001 n'a pas de
      # sudo pour l'installer). Sans ce shim le job meurt en exit 127 APRÈS le
      # push : image publiée, ni signée ni scannée. Le supprimer casse la chaîne.
      - name: Ensure envsubst
        run: |
          set -euo pipefail
          command -v envsubst >/dev/null 2>&1 && exit 0
          mkdir -p "$HOME/bin"
          {
            echo '#!/usr/bin/env python3'
            echo 'import os, string, sys'
            echo 'sys.stdout.write(string.Template(sys.stdin.read()).safe_substitute(os.environ))'
          } > "$HOME/bin/envsubst"
          chmod +x "$HOME/bin/envsubst"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign image (keyless)
        env:
          REF: ${{ steps.refs.outputs.ref }}
        run: cosign sign --yes "$REF"

      - name: Trivy scan
        env:
          REF: ${{ steps.refs.outputs.ref }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  asset=Linux-64bit ;;
            aarch64|arm64) asset=Linux-ARM64 ;;
            *) echo "::error::architecture de runner non supportée $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${asset}.tar.gz" \
            | tar -xz -C "$HOME/bin" trivy
          # --ignore-unfixed : on ne bloque que sur ce qui est corrigeable en amont.
          "$HOME/bin/trivy" image --exit-code 1 --severity CRITICAL --ignore-unfixed "$REF"

      - name: Generate SBOM
        env:
          REF: ${{ steps.refs.outputs.ref }}
        run: |
          set -euo pipefail
          # Binaire syft plutôt qu'anchore/sbom-action : l'action attache un SBOM
          # par invocation. `registry:` fait lire le registre directement via
          # ~/.docker/config.json, sans passer par un daemon local — l'image
          # scannée est donc bien celle qui a été poussée, pas une copie locale.
          case "$(uname -m)" in
            x86_64)  arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::architecture de runner non supportée $(uname -m)" >&2; exit 1 ;;
          esac
          v="${SYFT_VERSION#v}"
          mkdir -p "$HOME/bin" sbom
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${v}/syft_${v}_linux_${arch}.tar.gz" \
            | tar -xz -C "$HOME/bin" syft
          "$HOME/bin/syft" "registry:${REF}" -o spdx-json=sbom/operator.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ needs.setup.outputs.tag }}
          path: sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 30
