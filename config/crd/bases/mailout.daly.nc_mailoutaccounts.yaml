  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: mailoutaccounts.mailout.daly.nc
spec:
  group: mailout.daly.nc
  names:
    categories:
    - mailout
    kind: MailoutAccount
    listKind: MailoutAccountList
    plural: mailoutaccounts
    shortNames:
    - macct
    singular: mailoutaccount
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.gateway
      name: Gateway
      type: string
    - jsonPath: .status.username
      name: Username
      type: string
    - jsonPath: .status.secretName
      name: Secret
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MailoutAccount is one application's account on a MailoutGateway.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MailoutAccountSpec is one application's SMTP credentials. The operator
              generates the password, writes it to a Secret in this namespace, and keeps
              only its bcrypt hash — nothing but that Secret ever holds the cleartext.
            properties:
              disabled:
                description: Disabled keeps the account and its Secret but refuses
                  authentication.
                type: boolean
              dkim:
                description: DKIM overrides the gateway's signing keys for this account.
                items:
                  description: |-
                    DKIMKeySpec is one DKIM signing key. Mail is signed only when its sender
                    domain matches one of these; anything else is relayed unsigned rather than
                    signed under a domain the operator does not own.
                  properties:
                    domain:
                      description: Domain is the SDID, published in DNS as <selector>._domainkey.<domain>.
                      minLength: 1
                      type: string
                    headerKeys:
                      description: |-
                        HeaderKeys restricts which headers are signed. Empty uses the library
                        default, which is the right choice unless you know otherwise.
                      items:
                        type: string
                      type: array
                    privateKeySecretRef:
                      description: |-
                        PrivateKeySecretRef holds an RSA or Ed25519 key in PEM form. Key defaults
                        to "private.key"; a Secret produced by cert-manager uses "tls.key".
                      properties:
                        key:
                          description: Key defaults to the kind-specific key documented
                            on each field.
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    selector:
                      minLength: 1
                      type: string
                  required:
                  - domain
                  - privateKeySecretRef
                  - selector
                  type: object
                type: array
              gatewayRef:
                description: |-
                  GatewayReference points at the MailoutGateway an account uses. It may live in
                  another namespace — the operator's — which is why the gateway, not the
                  account, decides whether the reference is allowed.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace defaults to the operator's namespace, where
                      gateways live.
                    type: string
                required:
                - name
                type: object
              milters:
                description: |-
                  AccountMiltersSpec adjusts the gateway's filter chain for this account.
                  Filters can only be switched off, never added: an account must not be able to
                  route its mail through a filter of its choosing.
                properties:
                  disable:
                    description: |-
                      Disable names gateway filters to skip for this account, by their
                      spec.milters[].name.
                    items:
                      type: string
                    type: array
                type: object
              rotation:
                description: |-
                  Rotation is an opaque value: changing it regenerates the password. Any
                  string works — a date, a ticket number, a counter.
                type: string
              secretRef:
                description: |-
                  SecretRef names the Secret the operator creates and owns in this
                  namespace. It is of type kubernetes.io/basic-auth and also carries host,
                  port and tls, so it can be mounted straight into the application's
                  environment.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              username:
                description: |-
                  Username defaults to <namespace>.<name>. It must be unique across the
                  gateway; the webhook rejects a collision.
                type: string
            required:
            - gatewayRef
            - secretRef
            type: object
          status:
            description: MailoutAccountStatus is the observed state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gateway:
                description: Gateway is the resolved gateway, as namespace/name.
                type: string
              observedGeneration:
                format: int64
                type: integer
              rotationObserved:
                description: |-
                  RotationObserved is the spec.rotation value the current password was
                  generated for.
                type: string
              secretName:
                description: SecretName is the Secret holding the credentials.
                type: string
              username:
                description: Username is the name actually provisioned, defaults included.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
