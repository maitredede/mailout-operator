apiVersion: v1
kind: Namespace
metadata:
  name: mailout-system
  labels:
    app.kubernetes.io/name: mailout
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailout-operator
  namespace: mailout-system
  labels:
    app.kubernetes.io/name: mailout
    app.kubernetes.io/component: operator
spec:
  # Two replicas, one of which reconciles: leader election is enabled below, so
  # the standby takes over within the lease duration instead of waiting for a
  # node to be replaced. It is the rollout and the node drain this covers, not
  # throughput — a second active reconciler would fight the first.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mailout
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailout
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: mailout-operator
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          # Preferred, not required: a single-node cluster is a perfectly normal
          # place to run this, and a hard rule would leave the second replica
          # Pending forever there — trading the availability it was meant to buy
          # for a permanently degraded Deployment.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mailout
                    app.kubernetes.io/component: operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/maitredede/mailout-operator:dev
          args:
            - operator
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The dataplane runs the same image, so both halves stay in step.
            - name: MAILOUT_GATEWAY_IMAGE
              value: ghcr.io/maitredede/mailout-operator:dev
          ports:
            - name: webhook
              containerPort: 9443
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: mailout-webhook-tls
---
# One replica must stay up through a voluntary disruption — a node drain, a
# cluster upgrade. Without this, both replicas can be evicted at once and the
# relay is left with nobody to reconcile it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mailout-operator
  namespace: mailout-system
  labels:
    app.kubernetes.io/name: mailout
    app.kubernetes.io/component: operator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailout
      app.kubernetes.io/component: operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mailout-operator
  namespace: mailout-system
