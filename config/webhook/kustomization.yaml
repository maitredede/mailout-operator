apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests.yaml
  - service.yaml
  - certificate.yaml

# Point the generated webhook configuration at the real Service, and let
# cert-manager fill in its caBundle.
patches:
  - target:
      kind: ValidatingWebhookConfiguration
      name: validating-webhook-configuration
    patch: |-
      - op: replace
        path: /metadata/name
        value: mailout-validating-webhook
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/inject-ca-from: mailout-system/mailout-webhook
      - op: replace
        path: /webhooks/0/clientConfig/service/name
        value: mailout-webhook
      - op: replace
        path: /webhooks/0/clientConfig/service/namespace
        value: mailout-system
      - op: replace
        path: /webhooks/1/clientConfig/service/name
        value: mailout-webhook
      - op: replace
        path: /webhooks/1/clientConfig/service/namespace
        value: mailout-system
