---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-mailout-daly-nc-v1alpha1-mailoutaccount
  failurePolicy: Fail
  name: vmailoutaccount.mailout.daly.nc
  rules:
  - apiGroups:
    - mailout.daly.nc
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - mailoutaccounts
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-mailout-daly-nc-v1alpha1-mailoutgateway
  failurePolicy: Fail
  name: vmailoutgateway.mailout.daly.nc
  rules:
  - apiGroups:
    - mailout.daly.nc
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - mailoutgateways
  sideEffects: None
