# One application's account, in the application's own namespace. The operator
# generates the password and writes it to the Secret named here; the cleartext
# exists nowhere else.
apiVersion: mailout.daly.nc/v1alpha1
kind: MailoutAccount
metadata:
  name: invoicing
  namespace: billing
spec:
  gatewayRef:
    name: default
    # namespace defaults to the operator's namespace
  secretRef:
    name: invoicing-smtp
  # What this account may put in MAIL FROM and in the From header — and the only
  # domains it can have DKIM-signed. Leave it out and mail relays from anywhere,
  # unsigned.
  allowedSenders:
    - "*@example.com"
  # Change this value to rotate the password.
  rotation: "2026-09-07"
---
# What the application consumes. Written entirely by the operator.
#
# apiVersion: v1
# kind: Secret
